; TGIS-510 (Thermal Glue Inspection System)
; Home-lab / after-hours project. Separate from the 410 Rotaliner Tubing Seal
; Seam Monitor (factory floor, S7-300/ATmega2560) -- do not conflate.
;
; PLACEHOLDER: `board` is a generic ESP32-S3 dev board definition. Swap for the
; exact "Waveshare ESP32-S3-Zero-M (ESP32-S3FH4R2)" board once its PlatformIO
; board id is confirmed / a custom board JSON is added to boards/.
;
; The build's real MLX90640 driver is the patched local copy in
; lib/Adafruit_MLX90640_QC510/ (adds getRawFrame() -- see that folder's
; header comment) -- do NOT add "adafruit/Adafruit MLX90640" to lib_deps,
; PlatformIO would then have two conflicting copies of the same library.

[env:tgis510]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit NeoPixel@^1.12.0
